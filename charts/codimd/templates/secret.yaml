apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-codimd
type: Opaque
stringData:
  CMD_DB_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.database.user .Values.database.password .Release.Name .Values.database.name | quote }}
  CMD_SESSION_SECRET: {{ .Values.sessionSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
