apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-codimd
type: Opaque
stringData:
  CMD_DB_URL: {{ printf "postgres://%s:%s@%s:%v/%s" (.Values.database.user | urlquery) (.Values.database.password | urlquery) .Values.database.host .Values.database.port .Values.database.name | quote }}
  CMD_SESSION_SECRET: {{ .Values.sessionSecret | quote }}
