{{- if .Values.uploads.persistence.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-uploads
spec:
  capacity:
    storage: {{ .Values.uploads.persistence.size }}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Release.Namespace }}-{{ .Release.Name }}-uploads
  hostPath:
    path: {{ .Values.uploads.persistence.hostPath | quote }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-uploads
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Release.Namespace }}-{{ .Release.Name }}-uploads
  resources:
    requests:
      storage: {{ .Values.uploads.persistence.size }}
{{- end }}
