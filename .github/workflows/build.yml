name: 'Test and Build'

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]

    steps:
    - uses: actions/checkout@v4

    # from https://stackoverflow.com/a/69649733
    - name: Reconfigure git to use HTTP authentication
      run: >
        git config --global url."https://github.com/".insteadOf
        ssh://git@github.com/

    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - uses: actions/setup-node@v4
      name: Use Node.js ${{ matrix.node-version }}
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true

    - run: npm ci --ignore-scripts
    - name: Install Pandoc 3.1.11
      run: |
        mkdir -p node_modules/@hackmd/pandoc.js/.pandoc-local
        curl -fL --retry 3 https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-linux-amd64.tar.gz -o /tmp/pandoc.tar.gz
        tar -xzf /tmp/pandoc.tar.gz -C /tmp
        cp /tmp/pandoc-3.1.11/bin/pandoc node_modules/@hackmd/pandoc.js/.pandoc-local/pandoc
    - run: npm run test:ci
    - run: npm run build

  doctoc:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event.pull_request

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      name: Use Node.js 26
      with:
        node-version: 26
        check-latest: true
    - name: Install doctoc-check
      run: |
        npm install -g doctoc
        cp README.md README.md.orig
        npm run doctoc
        diff -q README.md README.md.orig
